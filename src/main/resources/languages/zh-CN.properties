PREFIX=\u005bRabbitAuth\u005d\u0020
NOT_READY=认证服务尚未就绪，请稍后重试。
INVALID_NAME=玩家名称只能包含 3–16 位英文字母、数字和下划线。
NAME_CASE=请使用注册时的名称大小写：{0}
DUPLICATE_CONNECTION=该账号已有连接，无法重复进入服务器。
REENTER_WAIT=距离上次下线过近，请稍后重新连接。
IP_CONNECTION_LIMIT=该 IP 同时连接的账号数量已达上限。
STORAGE_UNAVAILABLE=认证数据库不可用，请联系管理员。
BUSY=认证服务繁忙，请稍后重试。
LOGIN_TIMEOUT=登录超时，请重新进入服务器。
REGISTER_PROMPT=请注册：/r <密码> <确认密码>（或 /register）
LOGIN_PROMPT=请登录：/l <密码>（或 /login）
SUCCESS=认证成功。
WAIT=操作处理中，请稍后再试。
LOGIN_FIRST=请先登录。
ALREADY_AUTHENTICATED=你已通过认证。
ALREADY_REGISTERED=该账号已注册，请使用 /login 登录。
REGISTER_FIRST=该账号尚未注册，请先使用 /register 注册。
PASSWORD_MISMATCH=两次输入的密码不一致。
PASSWORD_LENGTH=密码长度不符合服务器配置要求。
PASSWORD_CHANGED=密码修改成功。
TOO_MANY_FAILURES=验证失败次数过多，请稍后再试。
AUTH_FAILED=密码错误，或该 IP 注册数量已达上限。
USAGE=用法：/login <密码>；/register <密码> <确认密码>；/changepassword <旧密码> <新密码>
NO_PERMISSION=你没有执行此操作的权限，或尚未登录。
UNKNOWN_ACCOUNT=该账号尚未注册。
RESET_SUCCESS=已重置 {0} 的密码。
RESET_USAGE=用法：/rabbitauth resetpassword <玩家名> <新密码>
WHITELIST_DENIED=你不在已启用的服务器白名单中。
WHITELIST_RESULT=白名单操作 {0} 完成；白名单启用状态：{1}
WHITELIST_ERROR=白名单操作失败：{0}
WHITELIST_ACTIVE=启用
WHITELIST_PAUSED=暂停
