# Storage and messages are server-local and are not synced to clients.
storage=sqlite
sqlite-file=rabbitauth.db
mysql-url=jdbc:mysql://localhost:3306/rabbitauth?connectTimeout=5000&socketTimeout=10000
mysql-user=rabbitauth
mysql-password=
language=zh-CN
min-password-length=8
max-password-length=120
login-timeout-seconds=120
max-login-attempts=5
before-login-allow-chat=false
command-whitelist=
hide-inventory=true
no-damage-before-login=true
blindness-before-login=false
spawn-enabled=true
spawn-dimension=minecraft:overworld
# Empty coordinate means use this dimension's shared spawn.
spawn-x=
spawn-y=
spawn-z=
reenter-cooldown-ticks=0
max-registrations-per-ip=3
max-connections-per-ip=3
same-ip-auto-login=false
auto-login-timeout-minutes=30
loopback-auto-login=false
